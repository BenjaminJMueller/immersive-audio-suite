name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: >-
    libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev
    libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libgl1-mesa-dev xvfb ninja-build

jobs:
  # Fast feedback: the realtime engine with every sanitizer and the fuzzer.
  core:
    name: Core (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: address+undefined
            flags: -DCMAKE_BUILD_TYPE=Debug -DRK_SANITIZE=address,undefined
          - name: thread
            flags: -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRK_SANITIZE=thread
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DRK_BUILD_APP=OFF -DRK_BUILD_PLUGINS=OFF -DRK_WERROR=ON ${{ matrix.flags }}
      - run: cmake --build build
      - name: Tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          if [ "${{ matrix.name }}" = "thread" ]; then
            setarch -R ./build/tests/rk_tests -tc="RtSwap*,stress*,engine*,speaker processor*,calibration threads*"
          else
            ./build/tests/rk_tests
          fi

  fuzz:
    name: Fuzz engine (5 min)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DRK_BUILD_APP=OFF -DRK_BUILD_PLUGINS=OFF -DRK_BUILD_TESTS=OFF -DRK_FUZZ=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build build
      - run: mkdir -p corpus && ./build/tests/rk_fuzz_engine -max_total_time=300 -max_len=4096 corpus

  # App, plugins, all tests and pluginval on every platform.
  build:
    name: Build and validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then EXTRA="-G Ninja"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRK_BUILD_NUMBER=${{ github.run_number }} $EXTRA
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          # Finds each test binary (paths differ between generators) and fails if one is missing.
          run_test() {
            f=$(find build -type f \( -name "$1" -o -name "$1.exe" \) -not -path "*CMakeFiles*" | head -1)
            if [ -z "$f" ]; then echo "::error::$1 not found"; exit 1; fi
            echo "Running $f"
            $RUN "$f"
          }
          run_test rk_tests
          run_test rk_shared_tests
          run_test rk_plugin_tests
      - name: Install Audio Units (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # macOS only finds Audio Units in the Components folder (pluginval and Logic alike).
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          find build -path "*Release*" -name "*.component" -maxdepth 6 -prune -exec cp -R {} ~/Library/Audio/Plug-Ins/Components/ \;
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i Rmkl || true
      - name: pluginval (strictness 10)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip; unzip -q pv.zip; PV=pluginval.app/Contents/MacOS/pluginval; RUN="";;
            Windows) curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip; 7z x -y pv.zip > /dev/null; PV=./pluginval.exe; RUN="";;
            Linux)   curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip; unzip -q pv.zip; PV=./pluginval; RUN="xvfb-run -a";;
          esac
          status=0
          while IFS= read -r -d '' plugin; do
            echo "::group::$plugin"
            $RUN $PV --strictness-level 10 --validate-in-process --timeout-ms 900000 --validate "$plugin" || status=1
            echo "::endgroup::"
          done < <(find build -path "*Release*" -name "*.vst3" -maxdepth 6 -prune -print0; \
                   [ "$RUNNER_OS" = "macOS" ] && find ~/Library/Audio/Plug-Ins/Components -maxdepth 1 -name "Raumklang*.component" -print0)
          exit $status
      - name: auval (Logic Pro, GarageBand)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Logic only loads Audio Units that pass Apple's validator.
          status=0
          for code in Rkq1 Rkb1; do
            echo "::group::auval $code"
            auval -strict -v aufx $code Rmkl || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: auval (Logic Pro checks every Audio Unit with it)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          find build -path "*Release*" -name "*.component" -maxdepth 6 -prune -exec cp -R {} ~/Library/Audio/Plug-Ins/Components/ \;
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i Rmkl || true
          status=0
          for code in Rkq1 Rkb1; do
            echo "::group::auval aufx $code Rmkl"
            auval -strict -v aufx $code Rmkl || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Collect builds
        shell: bash
        run: |
          mkdir -p dist
          find build -path "*Release*" \( -name "*.vst3" -o -name "*.component" -o -name "*.app" -o -name "Raumklang.exe" -o -name "Raumklang" \) -maxdepth 6 -prune -exec cp -R {} dist/ \;
          ls -la dist
      - name: Sign (macOS, ad hoc)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Without a sealed signature macOS cannot remember the microphone permission and
          # asks again whenever the audio device restarts, e.g. after standby. Ad hoc until the
          # app has a Developer ID; each update then asks once.
          for b in dist/*.component dist/*.vst3; do
            codesign --force --deep --sign - --timestamp=none "$b"
          done
          # The plugins travel inside the app (Contents/PlugIns, each signed on its own);
          # Raumklang installs them itself, so no script and no second Gatekeeper prompt.
          mkdir -p dist/Raumklang.app/Contents/PlugIns
          cp -R dist/*.component dist/*.vst3 dist/Raumklang.app/Contents/PlugIns/
          codesign --force --sign - --timestamp=none --options runtime \
            --entitlements packaging/signing/Raumklang.entitlements dist/Raumklang.app
          codesign --verify --deep --strict --verbose=2 dist/Raumklang.app
          codesign -d --entitlements - --xml dist/Raumklang.app | grep -q audio-input
      - name: Package (macOS disk image, Windows zip)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          VERSION="0.1.${{ github.run_number }}"
          mkdir -p pkg/Raumklang out
          cp LICENSE.md THIRD_PARTY_NOTICES.md pkg/Raumklang/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R dist/Raumklang.app pkg/Raumklang/
            cp packaging/mac/* pkg/Raumklang/
            ln -s /Applications pkg/Raumklang/Programme
            # The zip (without the Applications link) is what the app's updater installs.
            ditto -c -k --sequesterRsrc --keepParent pkg/Raumklang "out/Raumklang-$VERSION-mac.zip"
            zip -d "out/Raumklang-$VERSION-mac.zip" "Raumklang/Programme" > /dev/null || true
            hdiutil create -volname "Raumklang $VERSION" -srcfolder pkg/Raumklang -ov -format UDZO "out/Raumklang-$VERSION-mac.dmg"
          else
            mkdir -p pkg/Raumklang/Plugins
            cp dist/Raumklang.exe pkg/Raumklang/
            cp -R dist/*.vst3 pkg/Raumklang/Plugins/
            cp packaging/windows/* pkg/Raumklang/
            (cd pkg && 7z a -tzip "../out/Raumklang-$VERSION-Windows.zip" Raumklang > /dev/null)
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Raumklang-${{ runner.os }}
          path: dist
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: Download-${{ runner.os }}
          path: out
          if-no-files-found: error

  # Direct download: every push to main replaces the release "latest" (linked at the
  # top of the README); a tag v* also creates a fixed release with that version.
  release:
    needs: [core, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: Download-*, path: out, merge-multiple: true }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"; TITLE="Raumklang ${GITHUB_REF_NAME#v}"
          else
            TAG="latest"; TITLE="Raumklang (neueste Version, Build ${{ github.run_number }})"
            gh release delete latest --yes --cleanup-tag || true
          fi
          VERSION="0.1.${{ github.run_number }}"
          MAC="Raumklang-$VERSION-mac"; WIN="Raumklang-$VERSION-Windows"
          # What changed, in words: the bullet titles under "Was sich ändert" in the merged
          # pull request. Without a pull request (direct push) the commit subject.
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""' > pr-body.txt || true
          python3 - <<'PY' > notes.txt
          import re, subprocess
          body = open("pr-body.txt", encoding="utf-8").read()
          points, inside = [], False
          for line in body.splitlines():
              if line.startswith("#"):
                  inside = "ändert" in line.lower() or "changes" in line.lower()
                  continue
              # "- Title: details" (older pull requests: "- **Title**: details").
              m = re.match(r"\s*[-*] \*\*(.+?)\*\*", line) or re.match(r"\s*[-*] ([^:]{2,80}?):\s", line)
              if inside and m:
                  points.append("- " + m.group(1).strip().rstrip(".:"))
          if not points:
              points = ["- " + subprocess.check_output(["git", "log", "-1", "--format=%s"], text=True).strip()]
          print("\n".join(points[:8]))
          PY
          cat notes.txt
          # Update information for the app (app/Updater.cpp).
          python3 - "$MAC.zip" "$WIN.zip" <<'PY'
          import hashlib, json, os, sys
          def f(n):
              p = os.path.join("out", n)
              return {"name": n, "sha256": hashlib.sha256(open(p, "rb").read()).hexdigest(), "size": os.path.getsize(p)}
          build = int(os.environ["GITHUB_RUN_NUMBER"])
          notes = open("notes.txt", encoding="utf-8").read().strip()
          json.dump({"version": "0.1.%d" % build, "build": build, "notes": notes,
                     "files": {"mac": f(sys.argv[1]), "win": f(sys.argv[2])}},
                    open("out/latest.json", "w"), indent=2, ensure_ascii=False)
          PY
          cat out/latest.json
          NOTES="$(cat notes.txt)

          macOS: $MAC.dmg öffnen und Raumklang.app in Programme ziehen. Die App installiert die Plugins beim ersten Start selbst. Sie ist noch nicht beglaubigt: beim ersten Start Systemeinstellungen → Datenschutz & Sicherheit → Dennoch öffnen.
          Windows: $WIN.zip entpacken, Raumklang.exe starten und *Plugins installieren.bat* doppelklicken."
          gh release create "$TAG" "out/$MAC.dmg" "out/$MAC.zip" "out/$WIN.zip" out/latest.json --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest

  # "Raumklang Messen" for iPhone: geometry tests and a simulator build (no signing needed).
  ios:
    name: iPhone app (Raumklang Messen)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: SurveyKit tests
        run: swift test --package-path ios/SurveyKit
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios/RaumklangMessen && xcodegen generate
      - name: Build for the simulator
        run: |
          cd ios/RaumklangMessen
          xcodebuild -project RaumklangMessen.xcodeproj -scheme RaumklangMessen -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
