name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: >-
    libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev
    libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libgl1-mesa-dev xvfb ninja-build

jobs:
  # Fast feedback: the realtime engine with every sanitizer and the fuzzer.
  core:
    name: Core (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: address+undefined
            flags: -DCMAKE_BUILD_TYPE=Debug -DRK_SANITIZE=address,undefined
          - name: thread
            flags: -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRK_SANITIZE=thread
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DRK_BUILD_APP=OFF -DRK_BUILD_PLUGINS=OFF -DRK_WERROR=ON ${{ matrix.flags }}
      - run: cmake --build build
      - name: Tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          if [ "${{ matrix.name }}" = "thread" ]; then
            setarch -R ./build/tests/rk_tests -tc="RtSwap*,stress*,engine*,speaker processor*,calibration threads*"
          else
            ./build/tests/rk_tests
          fi

  fuzz:
    name: Fuzz engine (5 min)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DRK_BUILD_APP=OFF -DRK_BUILD_PLUGINS=OFF -DRK_BUILD_TESTS=OFF -DRK_FUZZ=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build build
      - run: mkdir -p corpus && ./build/tests/rk_fuzz_engine -max_total_time=300 -max_len=4096 corpus

  # App, plugins, all tests and pluginval on every platform.
  build:
    name: Build and validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then EXTRA="-G Ninja"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRK_BUILD_NUMBER=${{ github.run_number }} $EXTRA
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          # Finds each test binary (paths differ between generators) and fails if one is missing.
          run_test() {
            f=$(find build -type f \( -name "$1" -o -name "$1.exe" \) -not -path "*CMakeFiles*" | head -1)
            if [ -z "$f" ]; then echo "::error::$1 not found"; exit 1; fi
            echo "Running $f"
            $RUN "$f"
          }
          run_test rk_tests
          run_test rk_shared_tests
          run_test rk_plugin_tests
      - name: Install Audio Units (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # macOS only finds Audio Units in the Components folder (pluginval and Logic alike).
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          find build -path "*Release*" -name "*.component" -maxdepth 6 -prune -exec cp -R {} ~/Library/Audio/Plug-Ins/Components/ \;
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i Rmkl || true
      - name: pluginval (strictness 10)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip; unzip -q pv.zip; PV=pluginval.app/Contents/MacOS/pluginval; RUN="";;
            Windows) curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip; 7z x -y pv.zip > /dev/null; PV=./pluginval.exe; RUN="";;
            Linux)   curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip; unzip -q pv.zip; PV=./pluginval; RUN="xvfb-run -a";;
          esac
          status=0
          while IFS= read -r -d '' plugin; do
            echo "::group::$plugin"
            $RUN $PV --strictness-level 10 --validate-in-process --timeout-ms 900000 --validate "$plugin" || status=1
            echo "::endgroup::"
          done < <(find build -path "*Release*" -name "*.vst3" -maxdepth 6 -prune -print0; \
                   [ "$RUNNER_OS" = "macOS" ] && find ~/Library/Audio/Plug-Ins/Components -maxdepth 1 -name "Raumklang*.component" -print0)
          exit $status
      - name: auval (Logic Pro, GarageBand)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Logic only loads Audio Units that pass Apple's validator.
          status=0
          for code in Rkq1 Rkb1; do
            echo "::group::auval $code"
            auval -strict -v aufx $code Rmkl || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: auval (Logic Pro checks every Audio Unit with it)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          find build -path "*Release*" -name "*.component" -maxdepth 6 -prune -exec cp -R {} ~/Library/Audio/Plug-Ins/Components/ \;
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i Rmkl || true
          status=0
          for code in Rkq1 Rkb1; do
            echo "::group::auval aufx $code Rmkl"
            auval -strict -v aufx $code Rmkl || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Collect builds
        shell: bash
        run: |
          mkdir -p dist
          find build -path "*Release*" \( -name "*.vst3" -o -name "*.component" -o -name "*.app" -o -name "Raumklang.exe" -o -name "Raumklang" \) -maxdepth 6 -prune -exec cp -R {} dist/ \;
          ls -la dist
      - name: Package (macOS disk image, Windows zip)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p pkg/Raumklang/Plugins out
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R dist/Raumklang.app pkg/Raumklang/
            cp -R dist/*.component dist/*.vst3 pkg/Raumklang/Plugins/
            cp packaging/mac/* pkg/Raumklang/
            chmod +x "pkg/Raumklang/Plugins installieren.command"
            ln -s /Applications pkg/Raumklang/Programme
            # The zip (without the Applications link) is what the app's updater installs.
            ditto -c -k --sequesterRsrc --keepParent pkg/Raumklang out/Raumklang-mac.zip
            zip -d out/Raumklang-mac.zip "Raumklang/Programme" > /dev/null || true
            hdiutil create -volname Raumklang -srcfolder pkg/Raumklang -ov -format UDZO out/Raumklang-mac.dmg
          else
            cp dist/Raumklang.exe pkg/Raumklang/
            cp -R dist/*.vst3 pkg/Raumklang/Plugins/
            cp packaging/windows/* pkg/Raumklang/
            (cd pkg && 7z a -tzip ../out/Raumklang-Windows.zip Raumklang > /dev/null)
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Raumklang-${{ runner.os }}
          path: dist
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: Download-${{ runner.os }}
          path: out
          if-no-files-found: error

  # Direct download: every push to main replaces the release "latest" (linked at the
  # top of the README); a tag v* also creates a fixed release with that version.
  release:
    needs: [core, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: Download-*, path: out, merge-multiple: true }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"; TITLE="Raumklang ${GITHUB_REF_NAME#v}"
          else
            TAG="latest"; TITLE="Raumklang (neueste Version, Build ${{ github.run_number }})"
            gh release delete latest --yes --cleanup-tag || true
          fi
          SUBJECT="$(git log -1 --format='%s')"
          # Update information for the app (app/Updater.cpp).
          python3 - "$SUBJECT" <<'PY'
          import hashlib, json, os, sys
          def f(n):
              p = os.path.join("out", n)
              return {"name": n, "sha256": hashlib.sha256(open(p, "rb").read()).hexdigest(), "size": os.path.getsize(p)}
          build = int(os.environ["GITHUB_RUN_NUMBER"])
          json.dump({"version": "0.1.%d" % build, "build": build, "notes": sys.argv[1],
                     "files": {"mac": f("Raumklang-mac.zip"), "win": f("Raumklang-Windows.zip")}},
                    open("out/latest.json", "w"), indent=2)
          PY
          cat out/latest.json
          NOTES="${SUBJECT}

          **macOS**: Raumklang-mac.dmg öffnen, Raumklang.app in Programme ziehen und *Plugins installieren.command* doppelklicken. Die App ist noch nicht beglaubigt: beim ersten Start Systemeinstellungen → Datenschutz & Sicherheit → Dennoch öffnen.
          **Windows**: Raumklang-Windows.zip entpacken, Raumklang.exe starten und *Plugins installieren.bat* doppelklicken."
          gh release create "$TAG" out/Raumklang-mac.dmg out/Raumklang-mac.zip out/Raumklang-Windows.zip out/latest.json --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest

  # "Raumklang Messen" for iPhone: geometry tests and a simulator build (no signing needed).
  ios:
    name: iPhone app (Raumklang Messen)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: SurveyKit tests
        run: swift test --package-path ios/SurveyKit
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios/RaumklangMessen && xcodegen generate
      - name: Build for the simulator
        run: |
          cd ios/RaumklangMessen
          xcodebuild -project RaumklangMessen.xcodeproj -scheme RaumklangMessen -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
